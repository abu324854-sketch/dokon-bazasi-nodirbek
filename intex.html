<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart POS - Kassa Tizimi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        margin: 0;
        padding: 10px;
        font-family: monospace;
      }
    }
  </style>
</head>
<body class="bg-gray-100 h-screen font-sans flex flex-col overflow-hidden">

  <!-- Header / Yuqori panel -->
  <header class="bg-indigo-700 text-white px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <i data-lucide="shopping-bag" class="w-8 h-8"></i>
      <h1 class="text-xl font-bold tracking-wide">SMART POS</h1>
    </div>
    <div class="flex items-center space-x-4">
      <button onclick="openAddModal()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Yangi Tovar
      </button>
      <div class="text-right">
        <p class="text-xs text-indigo-200">Kassir:</p>
        <p class="text-sm font-semibold" id="cashier-name">Kassa #1</p>
      </div>
    </div>
  </header>

  <!-- Asosiy ishchi zona -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Chap qism: Tovar qidirish va Ro'yxat -->
    <div class="w-7/12 p-4 flex flex-col gap-4 border-r border-gray-200 bg-white">
      <!-- Skaner va Qidiruv kiratish paneli -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i data-lucide="barcode" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
          <input type="text" id="barcode-input" placeholder="Shtrix-kodni skanerlang yoki kodni kiriting..." 
                 class="w-full pl-10 pr-4 py-2.5 border-2 border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-600 font-mono text-lg" autofocus>
        </div>
        <div class="relative w-1/3">
          <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
          <input type="text" id="search-input" placeholder="Nomi bo'yicha..." 
                 class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- Tovarlar grid ro'yxati -->
      <div class="flex-1 overflow-y-auto pr-1">
        <div id="product-grid" class="grid grid-cols-3 gap-3">
          <!-- Tovarlar JS orqali dinamik chiqadi -->
        </div>
      </div>
    </div>

    <!-- O'ng qism: Savatcha va To'lov -->
    <div class="w-5/12 bg-gray-50 p-4 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i> Xarid Savatchasi
          </h2>
          <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Tozalash</button>
        </div>

        <!-- Savatcha jadvali -->
        <div class="max-h-[calc(100vh-280px)] overflow-y-auto bg-white rounded-lg border border-gray-200">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-100 text-gray-600 border-b">
              <tr>
                <th class="p-2.5">Tovar</th>
                <th class="p-2.5 text-center">Soni</th>
                <th class="p-2.5 text-right">Narxi</th>
                <th class="p-2.5 text-right">Jami</th>
                <th class="p-2.5 text-center"></th>
              </tr>
            </thead>
            <tbody id="cart-table-body">
              <!-- Savatcha elementlari JS orqali kiritiladi -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Hisob-kitob va To'lov tugmalari -->
      <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm mt-3 space-y-3">
        <div class="flex justify-between text-gray-600 text-sm">
          <span>Jami pozitsiyalar:</span>
          <span id="total-items-count">0 ta</span>
        </div>
        <div class="flex justify-between items-center pt-2 border-t">
          <span class="text-xl font-bold text-gray-800">Umumiy Summa:</span>
          <span class="text-2xl font-extrabold text-indigo-700" id="total-price">0 so'm</span>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="processPayment('Naqd')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold text-center flex justify-center items-center gap-2 transition">
            <i data-lucide="banknote" class="w-5 h-5"></i> Naqd To'lov
          </button>
          <button onclick="processPayment('Karta/QR')" class="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-center flex justify-center items-center gap-2 transition">
            <i data-lucide="qr-code" class="w-5 h-5"></i> Karta / QR
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Yangi tovar qo'shish -->
  <div id="add-product-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl w-96 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Yangi Tovar Qo'shish</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-500 font-medium">Shtrix-kod</label>
          <input type="text" id="new-barcode" class="w-full border p-2 rounded focus:outline-indigo-500 font-mono">
        </div>
        <div>
          <label class="text-xs text-gray-500 font-medium">Tovar Nomi</label>
          <input type="text" id="new-name" class="w-full border p-2 rounded focus:outline-indigo-500">
        </div>
        <div>
          <label class="text-xs text-gray-500 font-medium">Sotuv Narxi (so'm)</label>
          <input type="number" id="new-price" class="w-full border p-2 rounded focus:outline-indigo-500">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeAddModal()" class="px-4 py-2 border rounded text-gray-600">Bekor qilish</button>
        <button onclick="saveProduct()" class="px-4 py-2 bg-indigo-600 text-white rounded font-medium">Saqlash</button>
      </div>
    </div>
  </div>

  <!-- Chop etish uchun Chek formati (Print vaqtida ko'rinadi) -->
  <div id="printable-receipt" class="hidden">
    <div style="text-align: center; border-bottom: 1px dashed #000; padding-bottom: 5px; margin-bottom: 5px;">
      <h2 style="margin: 0; font-size: 16px;">"SMART STORE" DO'KONI</h2>
      <p style="margin: 2px 0; font-size: 11px;">Chek №<span id="receipt-id">0000</span></p>
      <p style="margin: 2px 0; font-size: 10px;" id="receipt-date"></p>
    </div>
    <table style="width: 100%; text-align: left; font-size: 11px; margin-bottom: 5px;">
      <thead>
        <tr style="border-bottom: 1px font-size: 10px;">
          <th>Nomi</th>
          <th>Soni</th>
          <th style="text-align: right;">Jami</th>
        </tr>
      </thead>
      <tbody id="receipt-items"></tbody>
    </table>
    <div style="border-top: 1px dashed #000; padding-top: 5px; font-size: 12px; font-weight: bold; text-align: right;">
      JAMI: <span id="receipt-total">0</span> so'm
    </div>
    <div style="text-align: center; margin-top: 10px; font-size: 10px;">
      Xaridingiz uchun rahmat!
    </div>
  </div>

  <script>
    // Boshlang'ich mahsulotlar bazasi (Demo)
    let products = [
      { id: 1, barcode: "4780001", name: "Coca-Cola 1.5L", price: 13000 },
      { id: 2, barcode: "4780002", name: "Lays Chips 90g", price: 15000 },
      { id: 3, barcode: "4780003", name: "Sut 1L", price: 11000 },
      { id: 4, barcode: "4780004", name: "Non (Tandir)", price: 4000 },
      { id: 5, barcode: "4780005", name: "Shokolad Nestle", price: 12000 }
    ];

    let cart = [];

    // Sahifa yuklanganda
    window.onload = () => {
      lucide.createIcons();
      renderProducts(products);
      focusBarcode();
    };

    // Skaner inputini doimiy aktiv ushlab turish
    function focusBarcode() {
      const input = document.getElementById('barcode-input');
      input.focus();
    }

    // Skaner va Enter bosilishini tinglash
    document.getElementById('barcode-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const code = this.value.trim();
        if (code) {
          addToCartByBarcode(code);
          this.value = '';
        }
      }
    });

    // Qidiruv inputi
    document.getElementById('search-input').addEventListener('input', function (e) {
      const term = e.target.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.barcode.includes(term));
      renderProducts(filtered);
    });

    // Tovarlar gridini chiqarish
    function renderProducts(list) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      list.forEach(p => {
        grid.innerHTML += `
          <div onclick="addToCart(${p.id})" class="p-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md cursor-pointer transition hover:border-indigo-500">
            <span class="text-[10px] font-mono text-gray-400">#${p.barcode}</span>
            <h4 class="font-bold text-gray-800 text-sm truncate">${p.name}</h4>
            <p class="text-indigo-600 font-semibold text-sm mt-1">${p.price.toLocaleString()} so'm</p>
          </div>
        `;
      });
    }

    // Shtrix-kod orqali savatga qo'shish
    function addToCartByBarcode(code) {
      const product = products.find(p => p.barcode === code);
      if (product) {
        addToCart(product.id);
      } else {
        alert("Bunday shtrix-kodli tovar topilmadi!");
      }
    }

    // Savatga qo'shish
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const cartItem = cart.find(item => item.id === productId);

      if (cartItem) {
        cartItem.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      focusBarcode();
    }

    // Savat miqdorini o'zgartirish
    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    }

    // Savatchani tozalash
    function clearCart() {
      cart = [];
      updateCartUI();
      focusBarcode();
    }

    // Savatcha UI-ni yangilash
    function updateCartUI() {
      const tbody = document.getElementById('cart-table-body');
      tbody.innerHTML = '';
      let total = 0;
      let count = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        count += item.qty;

        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2.5 font-medium text-gray-800">${item.name}</td>
            <td class="p-2.5 text-center">
              <div class="flex items-center justify-center gap-1">
                <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">-</button>
                <span class="w-6 text-center font-bold">${item.qty}</span>
                <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">+</button>
              </div>
            </td>
            <td class="p-2.5 text-right">${item.price.toLocaleString()}</td>
            <td class="p-2.5 text-right font-bold text-gray-800">${itemTotal.toLocaleString()}</td>
            <td class="p-2.5 text-center">
              <button onclick="changeQty(${item.id}, -${item.qty})" class="text-red-500 hover:text-red-700">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      });

      document.getElementById('total-price').innerText = `${total.toLocaleString()} so'm`;
      document.getElementById('total-items-count').innerText = `${count} ta`;
      lucide.createIcons();
    }

    // To'lovni amalga oshirish va Chek chiqarish
    function processPayment(type) {
      if (cart.length === 0) {
        alert("Savatcha bo'sh!");
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      // Chek tayyorlash
      document.getElementById('receipt-id').innerText = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('receipt-date').innerText = new Date().toLocaleString('uz-UZ');
      
      const receiptBody = document.getElementById('receipt-items');
      receiptBody.innerHTML = '';
      cart.forEach(item => {
        receiptBody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.qty} x ${item.price.toLocaleString()}</td>
            <td style="text-align: right;">${(item.price * item.qty).toLocaleString()}</td>
          </tr>
        `;
      });
      document.getElementById('receipt-total').innerText = total.toLocaleString();

      // Chop etish muloqot oynasini ochish
      window.print();

      alert(`To'lov muvaffaqiyatli amalga oshirildi! (${type})\nSumma: ${total.toLocaleString()} so'm`);
      clearCart();
    }

    // Modal funksiyalari
    function openAddModal() {
      document.getElementById('add-product-modal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('add-product-modal').classList.add('hidden');
    }

    function saveProduct() {
      const barcode = document.getElementById('new-barcode').value.trim();
      const name = document.getElementById('new-name').value.trim();
      const price = parseFloat(document.getElementById('new-price').value);

      if (barcode && name && price) {
        products.push({ id: Date.now(), barcode, name, price });
        renderProducts(products);
        closeAddModal();
        document.getElementById('new-barcode').value = '';
        document.getElementById('new-name').value = '';
        document.getElementById('new-price').value = '';
        focusBarcode();
      } else {
        alert("Barcha maydonlarni to'ldiring!");
      }
    }
  </script>
</body>
</html>
